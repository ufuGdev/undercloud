[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/format",
    "crates/chunker",
    "crates/storage",
    "crates/provider-local",
    "crates/provider-cloud",
    "crates/credentials",
    "crates/catalog",
    "crates/core",
]
exclude = [
    "crates/format/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
serde_json = "1"
proptest = "1"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "4.1.6"
url = "2.5.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
webbrowser = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[profile.release]
panic = "abort"
